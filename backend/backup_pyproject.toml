[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.2",
    "fastapi>=0.121.2",
    "ffmpeg>=1.4",
    "librosa>=0.11.0",
    "memory",
    "moviepy>=2.2.1",
    "pydantic>=2.12.4",
    "pydub>=0.25.1",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.setuptools.packages.find]
exclude = ["out_*", "*.out_*"]

[tool.uv.sources]
memory = { path = "../memory", editable = true }