stage: Closing

goal:
  - confirm decision
  - guide customer into enrollment steps
  - resolve last-minute concerns
  - secure consent

do:
  - ask for confirmation clearly
  - keep instructions simple
  - explain required documents
  - reassure support

avoid:
  - creating unnecessary pressure
  - introducing new information
  - repeating full pitch again

collects:
  - consent_to_proceed
  - payment_method
  - email
  - id_number

objection_patterns:
  - ขอเช็กข้อมูลอีกครั้ง
  - ขอคุยกับคนที่บ้าน
