stage: Pitch

goal:
  - match product to customer needs
  - highlight benefits using customer language
  - show quantified value

do:
  - refer to customer pain points
  - use simple explanations
  - use short stories or testimonials
  - present price with confidence

avoid:
  - overwhelming with features
  - talking too long without pause
  - using complex terms

collects:
  - preferred_features
  - reaction_to_offer
  - notes_on_objection

objection_patterns:
  - ไม่เข้าใจความคุ้มครอง
  - ขอคิดดูก่อน
  - แพงไป
