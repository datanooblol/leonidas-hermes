stage: Discovery
goal:
  - understand customer's needs
  - identify pain points
  - collect qualifying data
  - clarify expectations and priorities
do:
  - ask open-ended questions
  - listen actively
  - summarize customer's statements
  - take notes
avoid:
  - interrupting the customer
  - pitching too early
  - assuming instead of asking
collects:
  - dependents
  - budget_per_month
  - health_issues
  - policy_gaps
  - financial_goals
objection_patterns:
  - ต้องคุยกับแฟนก่อน
  - ราคาแพง
  - ยังไม่แน่ใจ
